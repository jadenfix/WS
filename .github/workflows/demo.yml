name: Offline demo provenance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r demo/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify exact source, real offline workflow, and published media
        run: python demo/verify_demo.py
